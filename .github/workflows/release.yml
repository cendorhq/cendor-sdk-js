name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write # commit the version bump + push tags back to main
  id-token: write # npm provenance via OIDC

jobs:
  # GATE — publishing is conditional on the gates passing, in THIS workflow's graph.
  # `ci.yml` and this workflow are two INDEPENDENT `push: main` triggers with no dependency between
  # them, so a commit whose CI run goes red still reaches `changeset publish` — measured in the
  # sibling repo (cendor-libs-js, 2026-07-27): one push published to npm and failed CI in the same
  # breath. A cross-workflow status is not a gate; a `needs:` edge is. These steps mirror ci.yml's
  # `build-test` job (same install, same Node matrix, same order) — keep the two in sync.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read # least privilege: verifying needs no write, only the publish job does
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile # resolves @cendor/* from npm
      # GATE G1 — exactly one @cendor/core. Runs BEFORE the suite: with two cores installed the tests
      # can still pass (each library works in isolation) while cross-library cooperation is silently
      # dead, so a green suite is not evidence.
      - name: G1 — one @cendor/core
        run: pnpm check:one-core
      - name: Typecheck + build
        run: pnpm build
      - name: Lint
        run: pnpm lint
      # A MAJOR is irreversible on npm and re-frames the product for every reader. It is never an
      # autonomous decision: a major changeset must carry an in-band `Approved-Major:` line.
      - name: a major bump needs explicit approval
        run: pnpm check:major
      - name: Test (no network — stub clients + undici MockAgent)
        run: pnpm test

  release:
    needs: verify # nothing is published unless every `verify` leg is green
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so changeset publish can tag
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile # resolves @cendor/* from npm
      - run: pnpm build

      # Direct publish on push (no Version PR), mirroring the Python release flow: when changesets are
      # present, `changeset version` bumps versions + writes CHANGELOGs, we commit that back to main
      # ([skip ci]), then `changeset publish` publishes @cendor/sdk with provenance and tags the version.
      - name: Version + publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pnpm exec changeset version
          git add -A
          git commit -m "chore: version packages [skip ci]" || echo "no version changes to commit"
          pnpm exec changeset publish
          git push --follow-tags origin HEAD:main || echo "nothing to push"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Provenance requires a PUBLIC source repo (sigstore rejects private with E422).
          # These repos are private, so provenance is off; re-enable ("true") once public.
          NPM_CONFIG_PROVENANCE: "false"
