name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write # commit the version bump + push tags back to main
  id-token: write # npm provenance via OIDC

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: cendor-sdk-js
          fetch-depth: 0

      # The SDK builds against the sibling @cendor/* libs (pnpm.overrides `link:`). Check them out +
      # build so `pnpm install` resolves. The PUBLISHED @cendor/sdk keeps its clean `^x` ranges (the
      # overrides live in the private root manifest, never in the package), so users install from npm.
      # Needs a `LIBS_REPO_TOKEN` secret (repo-scoped PAT) while cendor-libs-js is private.
      - uses: actions/checkout@v4
        with:
          repository: cendorhq/cendor-libs-js
          path: cendor-libs-js
          token: ${{ secrets.LIBS_REPO_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: cendor-sdk-js/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org

      - name: Build the linked @cendor/* libraries
        run: cd cendor-libs-js && pnpm install --frozen-lockfile && pnpm build
      - name: Install + build the SDK
        run: cd cendor-sdk-js && pnpm install --frozen-lockfile && pnpm build

      # Direct publish on push (no Version PR), mirroring the Python flow. Publish the libs first so the
      # SDK's `^x` @cendor/* ranges resolve for users.
      - name: Version + publish
        working-directory: cendor-sdk-js
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pnpm exec changeset version
          git add -A
          git commit -m "chore: version packages [skip ci]" || echo "no version changes to commit"
          pnpm exec changeset publish
          git push --follow-tags origin HEAD:main || echo "nothing to push"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
