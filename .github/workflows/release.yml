name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

# Least privilege at the workflow level; the release job widens it. `verify` declares `contents: read`
# of its own, so the gate can never write or publish.
permissions:
  contents: read

jobs:
  # GATE — publishing is conditional on the gates passing, in THIS workflow's graph.
  # `ci.yml` and this workflow are two INDEPENDENT `push: main` triggers with no dependency between
  # them, so a commit whose CI run goes red still reaches `changeset publish` — measured in the
  # sibling repo (cendor-libs-js, 2026-07-27): one push published to npm and failed CI in the same
  # breath. A cross-workflow status is not a gate; a `needs:` edge is. These steps mirror ci.yml's
  # `build-test` job (same install, same Node matrix, same order) — keep the two in sync.
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read # least privilege: verifying needs no write, only the publish job does
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile # resolves @cendor/* from npm
      # GATE G1 — exactly one @cendor/core. Runs BEFORE the suite: with two cores installed the tests
      # can still pass (each library works in isolation) while cross-library cooperation is silently
      # dead, so a green suite is not evidence.
      - name: G1 — one @cendor/core
        run: pnpm check:one-core
      - name: Typecheck + build
        run: pnpm build
      - name: Lint
        run: pnpm lint
      # A MAJOR is irreversible on npm and re-frames the product for every reader. It is never an
      # autonomous decision: a major changeset must carry an in-band `Approved-Major:` line.
      - name: a major bump needs explicit approval
        run: pnpm check:major
      - name: Test (no network — stub clients + undici MockAgent)
        run: pnpm test

  release:
    needs: verify # nothing is published unless every `verify` leg is green
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version-bump branch + tags
      pull-requests: write # open / update the "Version Packages" PR
      id-token: write # npm provenance via OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so changeset publish can tag
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile # resolves @cendor/* from npm
      - run: pnpm build

      # TWO-STEP RELEASE (the changesets "Version Packages" PR flow). This replaced direct
      # publish-on-push on 2026-07-29 (FLIP-CHECKLIST A4), because on a public repo an accidental push
      # to `main` carrying a changeset WAS a release — no human step between a merge and npm.
      #
      # The action branches on whether changesets are present, so one workflow covers both halves:
      #   1. changesets present  → open/update PR "chore: version packages" on branch
      #                            `changeset-release/main`, which runs `changeset version` there
      #                            (bumping versions + writing CHANGELOGs). NOTHING is published.
      #   2. no changesets, versions already bumped (i.e. that PR was merged)
      #                          → run `changeset publish`: publish to npm (pnpm rewrites workspace:^
      #                            into real ranges) and tag `@cendor/<x>@<version>`.
      # So PUBLISHING IS NOW A MERGE, not a push — and `needs: verify` still gates both halves.
      #
      # `pnpm install --lockfile-only` after versioning is currently a NO-OP and is deliberate
      # insurance: internal ranges are `workspace:^`, so a version bump does not touch
      # pnpm-lock.yaml (measured). If an internal range is ever pinned instead, the bump WOULD stale
      # the lockfile and the Version PR's own `--frozen-lockfile` install would fail. Keep it.
      #
      # createGithubReleases is off to preserve existing behaviour — today the npm side ships tags but
      # no GitHub Releases. Turning it on is a reasonable follow-up, not part of this change.
      - name: Version PR, or publish a merged one
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm exec changeset version && pnpm install --lockfile-only
          publish: pnpm exec changeset publish
          commit: "chore: version packages"
          title: "chore: version packages"
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Provenance requires a PUBLIC source repo (sigstore rejects private with E422).
          # These repos are private, so provenance is off; re-enable ("true") once public.
          NPM_CONFIG_PROVENANCE: "false"
