name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile # resolves @cendor/* from npm
      - name: Typecheck + build
        run: pnpm build
      - name: Lint
        run: pnpm lint
      - name: Test (no network — stub clients + undici MockAgent)
        run: pnpm test

  # Typecheck every ```ts snippet in the product docs (cendor-libs/docs + cendor-sdk/docs)
  # against the real packages — tabs that aren't executed rot.
  # Needs DOCS_REPOS_TOKEN (a PAT with read access to cendorhq/cendor-libs and
  # cendorhq/cendor-sdk) while those repos are private; the job skips itself when unset.
  # After they go public, drop the token from both checkout steps.
  docs-snippets:
    runs-on: ubuntu-latest
    steps:
      - name: Check for docs token
        id: token
        run: echo "have=${{ secrets.DOCS_REPOS_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: steps.token.outputs.have == 'true'
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: steps.token.outputs.have == 'true'
        with:
          repository: cendorhq/cendor-libs
          token: ${{ secrets.DOCS_REPOS_TOKEN }}
          path: _siblings/cendor-libs
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: steps.token.outputs.have == 'true'
        with:
          repository: cendorhq/cendor-sdk
          token: ${{ secrets.DOCS_REPOS_TOKEN }}
          path: _siblings/cendor-sdk
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        if: steps.token.outputs.have == 'true'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: steps.token.outputs.have == 'true'
        with:
          node-version: 22
          cache: pnpm
      - if: steps.token.outputs.have == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.token.outputs.have == 'true'
        run: pnpm build
      - name: Typecheck docs snippets
        if: steps.token.outputs.have == 'true'
        env:
          DOCS_DIRS: ${{ github.workspace }}/_siblings/cendor-libs/docs:${{ github.workspace }}/_siblings/cendor-sdk/docs
        run: pnpm check:docs
