name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The default GITHUB_TOKEN needs only checkout — least privilege for a public repo.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile # resolves @cendor/* from npm
      # GATE G1 — exactly one @cendor/core. Runs BEFORE the suite: with two cores installed the tests
      # can still pass (each library works in isolation) while cross-library cooperation is silently
      # dead, so a green suite is not evidence. Measured 2026-07-25: @cendor/guardrails 0.7.6 pinned
      # ^0.12.2 against an SDK on 0.15.0 and two guardrail tests went red with no useful message.
      - name: G1 — one @cendor/core
        run: pnpm check:one-core
      - name: Typecheck + build
        run: pnpm build
      - name: Lint
        run: pnpm lint
      # A MAJOR is irreversible on npm and re-frames the product for every reader. It is never an
      # autonomous decision: a major changeset must carry an in-band `Approved-Major:` line.
      - name: a major bump needs explicit approval
        run: pnpm check:major
      - name: Test (no network — stub clients + undici MockAgent)
        run: pnpm test

  # Typecheck every ```ts snippet in the product docs (cendor-libs/docs + cendor-sdk/docs) AND every
  # JSDoc `@example` in source (Type Teach) against the real packages — tabs/examples that aren't
  # executed rot. The SDK's own `packages/sdk/src` @examples always run (checked vs the built dist);
  # cendor-libs-js source @examples run when that repo is checked out (below) via CENDOR_LIBS_JS.
  # All three sibling repos are public since the 2026-07-29 flip, so they are checked out
  # unauthenticated and this job ALWAYS runs. It previously self-skipped whenever DOCS_REPOS_TOKEN was
  # unset — which meant a green run could prove nothing about the docs snippets at all.
  docs-snippets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cendorhq/cendor-libs
          path: _siblings/cendor-libs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cendorhq/cendor-sdk
          path: _siblings/cendor-sdk
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cendorhq/cendor-libs-js
          path: _siblings/cendor-libs-js
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Build the SIBLING too. `check:docs` maps `@cendor/*` to the sibling's built `dist` when one
      # exists, exactly as it maps `@cendor/sdk` to this repo's — that is what lets a docs tab teach
      # a core API in the same wave that adds it. Without this step the sibling is checked out but
      # never built, the mapping finds no `dist/index.d.ts`, and every snippet silently falls back
      # to the PUBLISHED `@cendor/core` — so the gate fails on new API for a reason that is not a
      # defect. Best-effort: a sibling that will not build must not take this job red on its own.
      - name: Build the sibling cendor-libs-js (for the @cendor/* type mapping)
        continue-on-error: true
        working-directory: _siblings/cendor-libs-js
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Typecheck docs snippets + source @examples
        env:
          DOCS_DIRS: ${{ github.workspace }}/_siblings/cendor-libs/docs:${{ github.workspace }}/_siblings/cendor-sdk/docs
          CENDOR_LIBS_JS: ${{ github.workspace }}/_siblings/cendor-libs-js
        run: pnpm check:docs
