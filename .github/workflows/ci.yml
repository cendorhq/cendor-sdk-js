name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The default GITHUB_TOKEN needs only checkout — least privilege for a public repo.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile # resolves @cendor/* from npm
      - name: Typecheck + build
        run: pnpm build
      - name: Lint
        run: pnpm lint
      - name: Test (no network — stub clients + undici MockAgent)
        run: pnpm test

  # Typecheck every ```ts snippet in the product docs (cendor-libs/docs + cendor-sdk/docs) AND every
  # JSDoc `@example` in source (Type Teach) against the real packages — tabs/examples that aren't
  # executed rot. The SDK's own `packages/sdk/src` @examples always run (checked vs the built dist);
  # cendor-libs-js source @examples run when that repo is checked out (below) via CENDOR_LIBS_JS.
  # Needs DOCS_REPOS_TOKEN (a PAT with read access to cendorhq/cendor-libs, cendorhq/cendor-sdk, and
  # cendorhq/cendor-libs-js) while those repos are private; the job skips itself when unset.
  # After they go public, drop the token from the checkout steps.
  docs-snippets:
    runs-on: ubuntu-latest
    steps:
      - name: Check for docs token
        id: token
        run: echo "have=${{ secrets.DOCS_REPOS_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: steps.token.outputs.have == 'true'
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: steps.token.outputs.have == 'true'
        with:
          repository: cendorhq/cendor-libs
          token: ${{ secrets.DOCS_REPOS_TOKEN }}
          path: _siblings/cendor-libs
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: steps.token.outputs.have == 'true'
        with:
          repository: cendorhq/cendor-sdk
          token: ${{ secrets.DOCS_REPOS_TOKEN }}
          path: _siblings/cendor-sdk
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: steps.token.outputs.have == 'true'
        with:
          repository: cendorhq/cendor-libs-js
          token: ${{ secrets.DOCS_REPOS_TOKEN }}
          path: _siblings/cendor-libs-js
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        if: steps.token.outputs.have == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.token.outputs.have == 'true'
        with:
          node-version: 22
          cache: pnpm
      - if: steps.token.outputs.have == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.token.outputs.have == 'true'
        run: pnpm build
      - name: Typecheck docs snippets + source @examples
        if: steps.token.outputs.have == 'true'
        env:
          DOCS_DIRS: ${{ github.workspace }}/_siblings/cendor-libs/docs:${{ github.workspace }}/_siblings/cendor-sdk/docs
          CENDOR_LIBS_JS: ${{ github.workspace }}/_siblings/cendor-libs-js
        run: pnpm check:docs
