version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(ci)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      dev-dependencies:
        dependency-type: development
    # Deferred majors — see plan/REPORT-TS7-OPENAI6-FEASIBILITY-2026-07-19.md §7.3.
    # (openai and vitest are deliberately NOT ignored — handled as manual bumps.)
    ignore:
      # TS 7: revisit at 7.1 (new compiler API) after ecosystem soak.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @types/node: track the lowest supported runtime (Node 22), not Node 26.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # undici 8 requires Node >=22.19; the Node 20 CI leg still exists (Node-matrix decision).
      - dependency-name: "undici"
        update-types: ["version-update:semver-major"]
      # biome 2: config-migration major — its own separate decision.
      - dependency-name: "@biomejs/biome"
        update-types: ["version-update:semver-major"]
      # @anthropic-ai/sdk is 0.x (majors ride the minor slot, so semver-major never matches):
      # pin by range until a capture-impact study clears a bump past 0.32.x.
      - dependency-name: "@anthropic-ai/sdk"
        versions: [">=0.33.0"]
